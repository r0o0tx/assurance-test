name: deploy-env

# Reusable per-environment deploy. State, RG, sizing and (optionally) subscription
# are all environment-scoped, so the same job deploys dev, staging or prod.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # prod protection rules gate approvals here
    env:
      TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      # The state, Key Vault and backup storage data planes default-deny public
      # access. This runner sits outside the VNet, so open its egress IP before
      # Terraform touches those data planes and close it again in cleanup.
      - name: Open deploy firewall (state)
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s ifconfig.me)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null
      - name: Terraform init
        working-directory: infra
        # A storage network-rule can take up to a minute to take effect, so retry
        # init until the backend is reachable rather than failing on the race.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if terraform init \
              -backend-config="resource_group_name=rg-assurance-test-${{ inputs.environment }}" \
              -backend-config="storage_account_name=${{ vars.STATE_SA }}" \
              -backend-config="key=${{ inputs.environment }}.tfstate"; then
              exit 0
            fi
            echo "init attempt $attempt failed (state firewall may still be propagating); retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Open deploy firewall (key vault + backup storage)
        working-directory: infra
        run: |
          set -euo pipefail
          KV="$(terraform output -raw key_vault_name 2>/dev/null || true)"
          BKP="$(terraform output -raw backup_sa 2>/dev/null || true)"
          [ -n "$KV" ]  && az keyvault network-rule add --name "$KV" --ip-address "$RUNNER_IP" >/dev/null || true
          [ -n "$BKP" ] && az storage account network-rule add --account-name "$BKP" --ip-address "$RUNNER_IP" >/dev/null || true
          # Let the key vault / backup rules propagate before apply reads secrets.
          sleep 30
      # Phase 1: create just the registry (and its dependencies). The backup
      # container group fails to create if its image is missing, so every image
      # must exist before the full apply runs.
      - name: Terraform apply (registry bootstrap)
        working-directory: infra
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"; SHA="${SHA:0:12}"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          export TF_VAR_deployer_ip_rules="[\"$RUNNER_IP\"]"
          terraform apply -auto-approve -target=module.registry \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var "web_image_tag=$SHA" -var "api_image_tag=$SHA"
      # Build and push all three images to the freshly created registry. Doing it
      # here lets the pipeline stand an environment up from nothing.
      - name: Build and push images
        working-directory: infra
        run: |
          set -euo pipefail
          ACR_NAME="$(terraform output -raw acr_name)"
          ACR="$(terraform output -raw acr_login_server)"
          az acr login --name "$ACR_NAME"
          for t in web api; do
            docker build -t "$ACR/$t:$SHA" "../app/$t"
            docker push "$ACR/$t:$SHA"
          done
          docker build -t "$ACR/backup:latest" "../scripts/backup"
          docker push "$ACR/backup:latest"
      # Phase 2: full apply. Every image now exists, so the nodes boot healthy
      # and the backup container group creates cleanly.
      - name: Terraform apply (${{ inputs.environment }})
        working-directory: infra
        run: |
          set -euo pipefail
          export TF_VAR_deployer_ip_rules="[\"$RUNNER_IP\"]"
          terraform apply -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var "web_image_tag=$SHA" -var "api_image_tag=$SHA"
      # Front Door reaches the origins over Private Link. The pending private
      # endpoint connection on each service must be approved before traffic flows.
      - name: Approve Front Door private link connections
        run: |
          set -euo pipefail
          RG="rg-assurance-test-${{ inputs.environment }}"
          for pls in astst-web-pls astst-api-pls; do
            for attempt in $(seq 1 12); do
              approved=$(az network private-endpoint-connection list --name "$pls" -g "$RG" \
                --type Microsoft.Network/privateLinkServices \
                --query "[?properties.privateLinkServiceConnectionState.status=='Approved'].id" -o tsv 2>/dev/null || true)
              [ -n "$approved" ] && { echo "$pls already approved"; break; }
              pending=$(az network private-endpoint-connection list --name "$pls" -g "$RG" \
                --type Microsoft.Network/privateLinkServices \
                --query "[?properties.privateLinkServiceConnectionState.status=='Pending'].id" -o tsv 2>/dev/null || true)
              if [ -n "$pending" ]; then
                for id in $pending; do
                  az network private-endpoint-connection approve --id "$id" --description "approved by deploy" >/dev/null
                done
                echo "$pls approved"; break
              fi
              echo "waiting for $pls connection (attempt $attempt)"; sleep 10
            done
          done
      # Freshly imaged nodes take a minute or two to pull the container and pass
      # the health probe. Wait for them before touching the rolling upgrade,
      # otherwise it aborts against a 100%-unhealthy (still-booting) baseline.
      - name: Wait for instance health
        run: |
          set -euo pipefail
          RG="rg-assurance-test-${{ inputs.environment }}"
          for t in web api; do
            for attempt in $(seq 1 30); do
              states="$(az vmss get-instance-view -g "$RG" -n "astst-$t-vmss" --instance-id '*' \
                --query "[].vmHealth.status.code" -o tsv 2>/dev/null || true)"
              if [ -n "$states" ] && ! echo "$states" | grep -q "unhealthy"; then
                echo "astst-$t-vmss healthy"; break
              fi
              echo "waiting for astst-$t-vmss health ($attempt)"; sleep 20
            done
          done
      - name: Health-gated rolling upgrade
        run: |
          set -euo pipefail
          RG="rg-assurance-test-${{ inputs.environment }}"
          # A fresh scale set is already on the latest model, so a rolling upgrade
          # is a no-op there; only start one if there is drift to roll out.
          for t in web api; do
            az vmss rolling-upgrade start -g "$RG" -n "astst-$t-vmss" || true
          done
      - name: Smoke test through Front Door
        working-directory: infra
        run: bash ../scripts/smoke/smoke-test.sh "$(terraform output -raw frontdoor_hostname)"
      # Always remove this runner's IP so no stale allowances accumulate. Terraform
      # self-cleans the Key Vault / backup ip_rules on the next apply; the state
      # account is not Terraform-managed, so remove it explicitly here.
      - name: Close deploy firewall
        if: always()
        working-directory: infra
        run: |
          [ -z "${RUNNER_IP:-}" ] && exit 0
          az storage account network-rule remove --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true
          KV="$(terraform output -raw key_vault_name 2>/dev/null || true)"
          BKP="$(terraform output -raw backup_sa 2>/dev/null || true)"
          [ -n "$KV" ]  && az keyvault network-rule remove --name "$KV" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true
          [ -n "$BKP" ] && az storage account network-rule remove --account-name "$BKP" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true

name: deploy-env

# Reusable per-environment deploy. State, RG, sizing and (optionally) subscription
# are all environment-scoped, so the same job deploys dev, staging or prod.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # prod protection rules gate approvals here
    env:
      TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # The state, Key Vault and backup storage data planes default-deny public
      # access. This runner sits outside the VNet, so open its egress IP before
      # Terraform touches those data planes and close it again in cleanup.
      - name: Open deploy firewall (state)
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s ifconfig.me)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null
      - name: Terraform init
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="resource_group_name=rg-assurance-test-${{ inputs.environment }}" \
            -backend-config="storage_account_name=${{ vars.STATE_SA }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"
      - name: Open deploy firewall (key vault + backup storage)
        working-directory: infra
        run: |
          set -euo pipefail
          KV="$(terraform output -raw key_vault_name 2>/dev/null || true)"
          BKP="$(terraform output -raw backup_sa 2>/dev/null || true)"
          [ -n "$KV" ]  && az keyvault network-rule add --name "$KV" --ip-address "$RUNNER_IP" >/dev/null || true
          [ -n "$BKP" ] && az storage account network-rule add --account-name "$BKP" --ip-address "$RUNNER_IP" >/dev/null || true
      - name: Terraform apply (${{ inputs.environment }})
        working-directory: infra
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"; SHA="${SHA:0:12}"
          export TF_VAR_deployer_ip_rules="[\"$RUNNER_IP\"]"
          terraform apply -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var "web_image_tag=$SHA" -var "api_image_tag=$SHA"
      - name: Health-gated rolling upgrade
        run: |
          set -euo pipefail
          RG="rg-assurance-test-${{ inputs.environment }}"
          for t in web api; do
            az vmss rolling-upgrade start -g "$RG" -n "astst-$t-vmss" \
              || az vmss update-instances -g "$RG" -n "astst-$t-vmss" --instance-ids '*'
          done
      - name: Smoke test through Front Door
        working-directory: infra
        run: bash ../scripts/smoke/smoke-test.sh "$(terraform output -raw frontdoor_hostname)"
      # Always remove this runner's IP so no stale allowances accumulate. Terraform
      # self-cleans the Key Vault / backup ip_rules on the next apply; the state
      # account is not Terraform-managed, so remove it explicitly here.
      - name: Close deploy firewall
        if: always()
        working-directory: infra
        run: |
          [ -z "${RUNNER_IP:-}" ] && exit 0
          az storage account network-rule remove --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true
          KV="$(terraform output -raw key_vault_name 2>/dev/null || true)"
          BKP="$(terraform output -raw backup_sa 2>/dev/null || true)"
          [ -n "$KV" ]  && az keyvault network-rule remove --name "$KV" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true
          [ -n "$BKP" ] && az storage account network-rule remove --account-name "$BKP" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true

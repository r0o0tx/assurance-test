name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
        working-directory: app/${{ matrix.tier }}
      - run: npm test
        working-directory: app/${{ matrix.tier }}

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build tier images
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          ACR_NAME=$(az acr list -g "${{ vars.STATE_RG }}" --query "[?starts_with(name,'aststacr')].name | [0]" -o tsv)
          ACR="$ACR_NAME.azurecr.io"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "ACR=$ACR" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          for t in web api; do docker build -t "$ACR/$t:$SHA" "app/$t"; done
      - name: Scan images (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR }}/api:${{ env.SHA }}
          severity: HIGH,CRITICAL
          exit-code: "0" # report; gate by policy when ready
      - name: Push images
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          for t in web api; do docker push "$ACR/$t:$SHA"; done

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Deploy to dev first (enable by setting repo variable DEPLOY_DEV=true once dev
  # is bootstrapped). Skipped by default so the pipeline stays green.
  dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_DEV == 'true' }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # Prod runs after dev (whether dev ran or was skipped). The prod GitHub
  # environment can require a manual approval before this proceeds.
  prod:
    needs: [dev]
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && (needs.dev.result == 'success' || needs.dev.result == 'skipped') }}
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

name: deploy-env

# Reusable per-environment deploy. State, RG, sizing and (optionally) subscription
# are all environment-scoped, so the same job deploys dev, staging or prod.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # prod protection rules gate approvals here
    env:
      TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform apply (${{ inputs.environment }})
        working-directory: infra
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"; SHA="${SHA:0:12}"
          terraform init \
            -backend-config="resource_group_name=rg-assurance-test-${{ inputs.environment }}" \
            -backend-config="storage_account_name=${{ vars.STATE_SA }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"
          terraform apply -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var "web_image_tag=$SHA" -var "api_image_tag=$SHA"
      - name: Health-gated rolling upgrade
        run: |
          set -euo pipefail
          RG="rg-assurance-test-${{ inputs.environment }}"
          for t in web api; do
            az vmss rolling-upgrade start -g "$RG" -n "astst-$t-vmss" \
              || az vmss update-instances -g "$RG" -n "astst-$t-vmss" --instance-ids '*'
          done
      - name: Smoke test through Front Door
        working-directory: infra
        run: bash ../scripts/smoke/smoke-test.sh "$(terraform output -raw frontdoor_hostname)"

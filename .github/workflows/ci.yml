name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: ci builds and scans only. Image push happens in the deploy
# workflow, after it has created (or confirmed) the registry, so the pipeline
# can bootstrap an environment from nothing.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        tier: [web, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/${{ matrix.tier }}/package-lock.json
      - run: npm ci
        working-directory: app/${{ matrix.tier }}
      - run: npm test
        working-directory: app/${{ matrix.tier }}

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image under scan
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          docker build -t "api:$SHA" app/api
          docker save "api:$SHA" -o api-image.tar
      # Hand the built image to the tokenless scan job.
      - name: Stage image for scan
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: api-image
          path: api-image.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-latest
    # No id-token here: this job handles a third-party scanner and must not
    # be able to mint cloud credentials.
    permissions:
      contents: read
    steps:
      - name: Fetch built image
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: api-image
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: api-image.tar
          severity: HIGH,CRITICAL
          exit-code: "0" # report; gate by policy when ready

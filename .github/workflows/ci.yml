name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tier: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
        working-directory: app/${{ matrix.tier }}
      - run: npm test
        working-directory: app/${{ matrix.tier }}

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push tier images
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          ACR_NAME=$(az acr list -g "${{ vars.STATE_RG }}" --query "[?starts_with(name,'aststacr')].name | [0]" -o tsv)
          az acr login --name "$ACR_NAME"
          ACR="$ACR_NAME.azurecr.io"
          for t in web api; do
            docker build -t "$ACR/$t:$SHA" "app/$t"
            docker push "$ACR/$t:$SHA"
          done

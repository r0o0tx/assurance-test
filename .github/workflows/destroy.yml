name: destroy

# Manual teardown of an environment. Runs from a GitHub runner (a stable IPv4
# egress), which the network-restricted state, Key Vault and backup data planes
# accept, so it works even when the operator's own machine cannot reach them.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: Type the environment name again to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    if: ${{ inputs.environment == inputs.confirm }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Open firewall (state)
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -s ifconfig.me)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az storage account network-rule add --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null
      - name: Terraform init
        working-directory: infra
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if terraform init \
              -backend-config="resource_group_name=rg-assurance-test-${{ inputs.environment }}" \
              -backend-config="storage_account_name=${{ vars.STATE_SA }}" \
              -backend-config="key=${{ inputs.environment }}.tfstate"; then
              exit 0
            fi
            echo "init attempt $attempt failed (state firewall may still be propagating); retrying in 20s"
            sleep 20
          done
          exit 1
      - name: Open firewall (key vault + backup storage)
        working-directory: infra
        run: |
          set -euo pipefail
          KV="$(terraform output -raw key_vault_name 2>/dev/null || true)"
          BKP="$(terraform output -raw backup_sa 2>/dev/null || true)"
          [ -n "$KV" ]  && az keyvault network-rule add --name "$KV" --ip-address "$RUNNER_IP" >/dev/null || true
          [ -n "$BKP" ] && az storage account network-rule add --account-name "$BKP" --ip-address "$RUNNER_IP" >/dev/null || true
          sleep 30
      - name: Terraform destroy (${{ inputs.environment }})
        working-directory: infra
        run: |
          set -euo pipefail
          export TF_VAR_deployer_ip_rules="[\"$RUNNER_IP\"]"
          terraform destroy -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var "web_image_tag=teardown" -var "api_image_tag=teardown"
      - name: Close firewall (state)
        if: always()
        run: |
          [ -z "${RUNNER_IP:-}" ] && exit 0
          az storage account network-rule remove --account-name "${{ vars.STATE_SA }}" --ip-address "$RUNNER_IP" >/dev/null 2>&1 || true
